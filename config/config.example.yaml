# autoRun 参考配置。
#
# 使用方式：
#   cp config/config.example.yaml config/config.yaml
#   chmod 600 config/config.yaml          # 必须，否则服务拒绝启动
#   export AUTORUN_KEY_ADMIN="$(python3 -c 'import secrets;print(secrets.token_urlsafe(32))')"
#
# 相对路径一律相对于**项目根目录**（即本文件的上一级），不受进程 cwd 影响。

version: 1

server:
  host: "127.0.0.1"             # 默认只监听回环。要对外提供服务改成 "0.0.0.0"，
                                # 但请同时启用 TLS 或置于 nginx/VPN 之后。
  port: 8770
  max_request_body_bytes: 65536
  socket_timeout_sec: 15        # 读写超时，防 slowloris 慢速攻击
  max_worker_threads: 16
  shutdown_grace_sec: 10
  kill_jobs_on_shutdown: false  # false：服务重启不打断正在跑的任务

tls:
  enabled: false
  cert_file: null
  key_file: null
  client_ca_file: null          # 填入 CA 证书即要求 mTLS（最强的访问控制）

auth:
  header: "X-Auth-Key"
  min_key_length: 32            # 密钥短于此长度则拒绝启动
  keys:
    # 管理员密钥：权限最大，可执行所有别名 + 裸命令 + kill。等于受认证的远程任意
    # 命令执行，务必严格保管，只留给本人使用。
    - id: "admin"
      key: "${AUTORUN_KEY_ADMIN}"   # 从环境变量读取，密钥不落 YAML
      allowed_aliases: ["*"]        # "*" = 所有别名
      allow_raw: true               # 允许执行未预定义的裸命令
      allow_kill: true              # 允许 kill 任务

    # CI 专用密钥（最小权限调用方）：给自动化系统（CI/CD、脚本、机器人）用。
    # 与 admin 相反，只放开它该干的那几件事，即使泄露也炸不掉机器。
    # 每个调用方一把独立密钥，审计日志里以 id 区分是谁发起的请求。
    # 启用步骤：① 取消下面几行注释 ② 在 .env 里设 AUTORUN_KEY_CI=<强密钥>
    #          ③ allowed_aliases 改成实际要放开的别名 ④ reload/restart
    # - id: "ci-bot"
    #   key: "${AUTORUN_KEY_CI}"
    #   allowed_aliases: ["deploy", "disk_usage"]  # 只能跑这几个预定义别名
    #   allow_raw: false            # 禁止裸命令（最小权限的关键）
    #   allow_kill: true
    #   allowed_ips: ["10.20.0.0/24"]   # 可选：在全局白名单之上按 key 再收窄来源

security:
  ip_whitelist:                 # 必填。空列表会拒绝启动（避免"空=全放通"的误解）
    - "127.0.0.1/32"
    - "::1/128"
    # - "10.20.0.0/24"
  trust_proxy: false            # false 时完全忽略 X-Forwarded-For，socket 对端是唯一可信来源
  trusted_proxies: []           # trust_proxy 为真时必填
  allow_raw_commands: false     # 裸命令执行的全局开关。开启等于开放受认证的 RCE。
  raw_command_denylist:         # 仅对裸命令生效；属纵深防御，不是安全边界
    - "(?i)\\brm\\s+-rf\\s+/(\\s|$)"
    - "(?i)\\bmkfs\\b"
    - "(?i)\\bdd\\s+.*of=/dev/"
    - ":\\(\\)\\s*\\{.*\\};:"
  allow_kill_untracked_pids: false   # 只允许杀本服务启动的任务
  health_requires_auth: false   # /healthz 免密钥，但仍需通过 IP 白名单

rate_limit:
  enabled: true
  requests_per_minute: 60
  burst: 20
  per_key: true                 # 按 (客户端IP, key_id) 分桶

execution:
  shell: "/bin/bash"
  shell_args: ["-lc"]
  default_cwd: "/"
  default_timeout_sec: 900
  max_timeout_sec: 7200
  max_concurrent_jobs: 10
  max_output_bytes: 52428800    # 单任务日志上限 50 MiB
  on_output_limit: "kill"       # kill：超限即终止任务；warn：仅告警
                                # 有常驻型任务持续输出日志时请改成 warn
  env_passthrough: ["PATH", "LANG", "HOME"]
  env_extra:
    AUTORUN: "1"
  run_as:                       # 通过 setpriv 为所有任务降权（强烈建议在 root 下运行时配置）
    user: null
    group: null

# 预定义命令别名。客户端只能提交别名和已声明的参数值，永远无法提交命令体本身。
commands:
  # argv 形式：完全不经过 shell，最安全。
  disk_usage:
    description: "查看磁盘占用"
    argv: ["/bin/df", "-h"]
    mode: "sync"                # 短命令，同步返回输出
    timeout_sec: 10

  uptime:
    description: "查看系统负载"
    argv: ["/usr/bin/uptime"]
    mode: "sync"
    timeout_sec: 10

  # shell 形式：支持管道与 && 等语法。
  # deploy:
  #   description: "拉取最新代码并重启"
  #   shell: "cd /app && git pull --ff-only && ./restart.sh"
  #   cwd: "/app"
  #   timeout_sec: 1800
  #   singleton: true           # 已有实例在跑时拒绝，避免并发部署

  # 常驻型任务：timeout_sec: 0 表示不限时，永不因超时被终止。
  # 配 singleton: true 避免重复提交起出第二个实例。
  # 注意 autoRun 不是进程监督器：程序崩溃不会自动重启，需要这个能力请用 systemd。
  # daemon_example:
  #   description: "常驻程序（不限时）"
  #   shell: "exec /path/to/your/program --flag"
  #   timeout_sec: 0
  #   mode: "background"
  #   singleton: true

  # 带参数：每个参数必须声明 pattern（正则白名单），否则拒绝启动。
  # 值先经 re.fullmatch 校验，通过后再用 shlex.quote 代入。
  #
  # pattern 常用写法：
  #   "^v[0-9]+\\.[0-9]+\\.[0-9]+$"   版本号
  #   "^[A-Za-z0-9._-]+$"            标识符（无空格）
  #   "^[A-Za-z0-9 ._/-]+$"          含空格与路径分隔符
  #   "^.*$"                         不限制（任意单行文本）
  # 注意不能写 pattern: ""，空正则只匹配空字符串，会拒绝所有输入（启动时会报错提示）。
  # 控制字符（NUL、换行等）无论 pattern 多宽松都一律拒绝。
  # rollback:
  #   description: "回滚到指定版本"
  #   shell: "cd /app && ./rollback.sh {tag}"
  #   params:
  #     tag:
  #       required: true
  #       pattern: "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
  #       max_length: 32
  #   timeout_sec: 600

paths:
  pid_file: "runtime/autorun.pid"
  state_dir: "runtime/state"          # processes.json / processes.txt / .registry.lock
  job_log_dir: "runtime/logs/jobs"    # 每个任务一个 <job_id>.log

logging:
  level: "INFO"
  audit_file: "runtime/logs/audit.jsonl"    # 审计流水，每行一个 JSON
  service_file: "runtime/logs/service.log"  # 服务自身运行日志与堆栈
  rotation:
    strategy: "size"            # size | time
    max_bytes: 52428800
    when: "midnight"            # strategy 为 time 时生效
    backup_count: 14
  redact_patterns:              # 落日志前对命令文本脱敏
    - "(?i)(password|passwd|token|secret|api[_-]?key)\\s*=\\s*\\S+"
    - "(?i)Authorization:\\s*\\S+"

registry:
  retain_finished_hours: 72     # 已结束任务的保留时长
  max_records: 2000
  render_text_view: true        # 额外渲染人类可读的 processes.txt

# GPU 利用率监控（可选）。训练集群里 GPU 长时间空闲通常意味着训练挂了或没起来，
# 卡白占着；开启后可自动发现并处置。采样用 nvidia-smi，零额外依赖。
# 监控线程独立于请求处理：采样超时、nvidia-smi 缺失、动作失败都只记日志，不影响服务。
gpu_monitor:
  enabled: false
  nvidia_smi: null              # null=自动 which；受限 PATH 下写绝对路径，
                                # 例如 "/home/opt/cuda_tools/nvidia-smi"
  interval_sec: 15              # 采样周期
  sample_timeout_sec: 10        # 单次 nvidia-smi 超时（它偶尔会 hang）
  idle_util_threshold: 20       # 单卡利用率低于此值算"空闲"，用于 idle_count 指标

  # 可配多条规则。每条独立维护去抖状态（以 name 为键，name 必须唯一）。
  rules:
    - name: "gpu-idle"                 # 唯一标识，用于去抖状态与日志/审计关联
      metric: "avg_util"               # avg_util | idle_count | min_gpu_util
                                       #  | max_gpu_util | max_temp | max_mem_util
      comparator: "below"              # below | above
      threshold: 30
      duration_sec: 300                # 连续满足 5 分钟才触发（去抖，避免瞬时波动误报）
      cooldown_sec: 1800               # 触发后 30 分钟内不重复（避免告警轰炸）
      notify_resolved: true            # 恢复正常后发一封"已恢复"通知
      actions:                         # 可组合，单个动作失败不影响其余
        - type: "log"                  # 写审计(gpu_alert)+服务日志
        # - type: "exec"               # 执行预定义别名（复用 commands 段）
        #   alias: "pkill_gpu"         # 别名必须已在 commands 中定义，否则启动即报错
        # - type: "email"              # 发邮件，需下方 smtp 段 + .env 里的 SMTP_USER/SMTP_PASS
        #   to: ["ops@corp.com"]       # 收件人列表

    # - name: "too-many-idle"
    #   metric: "idle_count"
    #   comparator: "above"
    #   threshold: 4                    # 超过 4 张卡空闲
    #   duration_sec: 600
    #   cooldown_sec: 3600
    #   actions:
    #     - type: "email"
    #       to: ["ops@corp.com"]

# 邮件通知配置。仅当上面存在 email 动作时才需要（否则整段可省略/注释）。
#
# 使用前提：在 .env 里补两个变量（YAML 用 ${...} 引用，密钥不落 YAML）：
#   SMTP_USER=你的完整邮箱地址        # 如 alice@163.com
#   SMTP_PASS=客户端授权码            # 不是登录密码！在邮箱网页版开启 SMTP 后获取
#
# 常见邮箱服务器（都用 SSL 465）：
#   163 邮箱 : host: "smtp.163.com"   （注意不是 ssmtp.163.com）
#   QQ 邮箱  : host: "smtp.qq.com"
#   Gmail    : host: "smtp.gmail.com"（需用应用专用密码）
#
# 重要：对 163/QQ 等，from_addr 必须与 username(即 SMTP_USER) 是同一个邮箱地址，
#       否则服务器会以"发件人与认证账号不符"拒信（常见 553 报错）。
#
# 审计与日志不会打印 password。
# smtp:
#   host: "smtp.163.com"
#   port: 465
#   security: "ssl"             # ssl(465) | starttls(587) | none；端口可省略按此推断
#   username: "${SMTP_USER}"    # 登录账号 = 完整邮箱地址
#   password: "${SMTP_PASS}"    # 客户端授权码，放 .env
#   from_addr: "alice@163.com"  # 发件人；须等于 username 对应的邮箱
#   timeout_sec: 15
#   # 若本机无公网直连出口、只有 HTTP 代理（内网集群常见），填代理地址，发信会
#   # 经 CONNECT 隧道走代理。留空/去掉则直连。smtplib 不认 http_proxy 环境变量，
#   # 所以必须在这里显式配置。
#   proxy: "http://your-proxy-host:8188"
